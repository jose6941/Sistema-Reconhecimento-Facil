[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["reconhecimento"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["venv", "frontend", "CameraWebServer"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
